# How Netlify publishes the site.
#
# Each time something is merged or saved in the CMS, Netlify runs the script below.
# It copies the site to _site/ and writes the text from /data into the pages there,
# so the content is in the page itself and does not depend on scripts in the browser.
# The files in this repository are not changed. See /scripts/prerender.mjs.

[build]
  command = "node scripts/prerender.mjs"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

# The lighter versions of the photographs (written by the script above) carry a fingerprint of
# their content in the file name, so a browser can keep them without asking again.
[[headers]]
  for = "/images/sized/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
