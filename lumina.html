<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KANDO Framework™ – Attolloo Group</title>
  <meta name="description" content="The KANDO Framework™ systematically converts operational experience into strategic intelligence, and raw operational data into verifiable customer value." />
  <link rel="canonical" href="https://attolloogroup.com/lumina.html" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Attolloo Group" />
  <meta property="og:title" content="KANDO Framework™ – Attolloo Group" />
  <meta property="og:description" content="The KANDO Framework™ systematically converts operational experience into strategic intelligence, and raw operational data into verifiable customer value." />
  <meta property="og:url" content="https://attolloogroup.com/lumina.html" />
  <meta property="og:image" content="https://attolloogroup.com/images/uploads/tuscany-italy-2023-floral-design-retreat-wine-tasting-600x450.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebPage",
        "@id": "https://attolloogroup.com/lumina.html#webpage",
        "url": "https://attolloogroup.com/lumina.html",
        "name": "KANDO Framework™ – Attolloo Group",
        "description": "The KANDO Framework™ systematically converts operational experience into strategic intelligence, and raw operational data into verifiable customer value.",
        "inLanguage": "en",
        "isPartOf": {
          "@id": "https://attolloogroup.com/#website"
        },
        "about": {
          "@id": "https://attolloogroup.com/#organization"
        }
      },
      {
        "@type": "WebSite",
        "@id": "https://attolloogroup.com/#website",
        "url": "https://attolloogroup.com/",
        "name": "Attolloo Group"
      },
      {
        "@type": "Organization",
        "@id": "https://attolloogroup.com/#organization",
        "name": "Attolloo Group AS",
        "url": "https://attolloogroup.com/"
      }
    ]
  }
  </script>
  <link rel="stylesheet" href="style.css?v=10" />
</head>
<body class="page page--lumina">

  <div class="page-top-space"></div>

  <!-- HERO -->
  <section class="hero hero--lumina" id="lumina-hero" aria-labelledby="heroTitle">
    <div class="inner hero-inner">
      <h1 class="hero-title" id="heroTitle"></h1>
      <p id="heroSubtitle" class="preserve-newlines hero-subtitle"></p>
    </div>
  </section>

  <!-- INNHOLD -->
  <main class="container">
    <section class="section">
      <div class="cards" id="lumina-sections"></div>
    </section>
  </main>

  <!-- FOOTER -->
  <div id="footer"></div>

  <script>
    // Last Lumina-data
    (async function loadLumina() {
      try {
        const res = await fetch("data/lumina.json?v=" + Date.now(), { cache: "no-store" });
        const data = await res.json();

        // HERO
        document.getElementById("heroTitle").textContent = data.title || "";
        document.getElementById("heroSubtitle").textContent = data.subtitle || "";

        const hero = document.getElementById("lumina-hero");
        const img = data.hero_image || data.image || "";
        if (img) {
          hero.style.setProperty("--hero-img", `url(${img})`);
          hero.style.backgroundImage = `linear-gradient(135deg, rgba(90,40,10,0.7), rgba(160,110,30,0.6)), url(${img})`;
          hero.classList.add("has-image");
        } else {
          hero.classList.remove("has-image");
        }

        // SEKSJONER
        const wrap = document.getElementById("lumina-sections");
        const sections = Array.isArray(data.sections) ? data.sections : [];
        if (!sections.length) {
          wrap.innerHTML = "<p>Content for the KANDO Framework has not been published yet.</p>";
          return;
        }

        wrap.innerHTML = sections.map(s => `
          <article class="card card--lumina">
            ${s.image ? `<div class="card_media"><img src="${s.image}" alt=""></div>` : ""}
            <div class="card_body">
              ${s.heading ? `<h2 class="card_title">${s.heading}</h2>` : ""}
              ${s.body ? `<div class="card_text preserve-newlines">${s.body}</div>` : ""}
            </div>
          </article>
        `).join("");
      } catch (e) {
        console.error("Klarte ikke laste data/lumina.json", e);
      }
    })();

    // Footer
    (async () => {
      try {
        const res = await fetch("footer.html", { cache: "no-store" });
        const html = await res.text();
        document.getElementById("footer").innerHTML = html;
      } catch (err) {
        console.error("Kunne ikke laste footer:", err);
      }
    })();
  </script>
  <script src="/js/menu-init.js" defer></script>
</body>
</html>
