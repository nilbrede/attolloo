<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="group" aria-labelledby="t d" font-family="Schibsted Grotesk, Segoe UI, Arial, sans-serif">
  <title id="t">Three open research questions, by framework</title>
  <desc id="d">6Sense Filter: predictive validity, studied by longitudinal tracking and survival analysis. AI Compass: inter-rater reliability, studied by psychometric testing with Cohen's kappa and intra-class correlation, suited to a master's thesis. Polaris Sprints: hybrid agile governance, studied by qualitative case study or action research. Each framework links to its page.</desc>
  <text x="22.0" y="22.0" font-size="12" font-weight="600" fill="#4b5d72" text-anchor="start">Framework</text>
  <text x="124.0" y="22.0" font-size="12" font-weight="600" fill="#4b5d72" text-anchor="start">Open question</text>
  <text x="246.0" y="22.0" font-size="12" font-weight="600" fill="#4b5d72" text-anchor="start">Approach</text>
  <rect x="8" y="32" width="384" height="78" rx="6" fill="#ffffff" stroke="#d6dfe8" stroke-width="1.5"/>
  <a href="/6sense.html">
