  <text x="124.0" y="67.0" font-size="13.5" font-weight="700" fill="#002448" text-anchor="start">Predictive</text>
  <text x="124.0" y="84.0" font-size="13.5" font-weight="700" fill="#002448" text-anchor="start">validity</text>
  <text x="246.0" y="67.0" font-size="12" font-weight="500" fill="#4b5d72" text-anchor="start">Longitudinal tracking,</text>
  <text x="246.0" y="83.0" font-size="12" font-weight="500" fill="#4b5d72" text-anchor="start">survival analysis</text>
  <rect x="8" y="119" width="384" height="78" rx="6" fill="#ffffff" stroke="#d6dfe8" stroke-width="1.5"/>
  <a href="/ai-compass.html">
