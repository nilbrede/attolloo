  <path d="M111,153.0 l5,5 l-5,5" fill="none" stroke="#4b5d72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M233,153.0 l5,5 l-5,5" fill="none" stroke="#4b5d72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="124.0" y="154.0" font-size="13.5" font-weight="700" fill="#002448" text-anchor="start">Inter-rater</text>
  <text x="124.0" y="171.0" font-size="13.5" font-weight="700" fill="#002448" text-anchor="start">reliability</text>
  <text x="246.0" y="148.0" font-size="12" font-weight="500" fill="#4b5d72" text-anchor="start">Psychometric testing:</text>
