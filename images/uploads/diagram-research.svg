    <text x="22" y="67" font-size="14" font-weight="700" fill="#002448">6Sense</text>
    <text x="22" y="84" font-size="14" font-weight="700" fill="#002448">Filter</text>
  </a>
  <path d="M111,66.0 l5,5 l-5,5" fill="none" stroke="#4b5d72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
