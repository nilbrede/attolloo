<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t d" font-family="Schibsted Grotesk, Segoe UI, Arial, sans-serif">
  <title id="t">The two steps of the Responsible AI Gate</title>
  <desc id="d">Step one: red lines, five exclusions checked first. Any hit stops the assessment. Step two, inside the 6Sense Filter: misuse and dual-use risk, seven criteria each scored one to five, where one is high risk and five is low risk.</desc>
  <text x="16.0" y="24.0" font-size="13" font-weight="600" fill="#4b5d72" text-anchor="start">Every venture, before it is scored</text>
  <line x1="40" y1="32" x2="40" y2="47" stroke="#002448" stroke-width="1.5"/>
  <path d="M35,45 L40,52 L45,45" fill="none" stroke="#002448" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="8" y="52" width="262" height="62" rx="6" fill="#ffffff" stroke="#d6dfe8" stroke-width="1.5"/>
  <circle cx="34" cy="83" r="12" fill="#ffffff" stroke="#002448" stroke-width="1.5"/>
  <text x="34.0" y="88.0" font-size="13.5" font-weight="700" fill="#002448" text-anchor="middle">1</text>
  <text x="56.0" y="79.0" font-size="15" font-weight="700" fill="#002448" text-anchor="start">Red lines</text>
  <text x="56.0" y="97.0" font-size="12.5" font-weight="500" fill="#4b5d72" text-anchor="start">Five exclusions, checked first</text>
  <line x1="270" y1="83" x2="309" y2="83" stroke="#002448" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M306,78 L313,83 L306,88" fill="none" stroke="#002448" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="291.0" y="73.0" font-size="11.5" font-weight="600" fill="#4b5d72" text-anchor="middle">any hit</text>
  <rect x="316" y="62" width="76" height="42" rx="6" fill="#f6e3b4" stroke="#002448" stroke-width="1.5"/>
  <text x="354.0" y="88.0" font-size="14" font-weight="700" fill="#002448" text-anchor="middle">Stop</text>
  <line x1="40" y1="114" x2="40" y2="137" stroke="#002448" stroke-width="1.5"/>
  <path d="M35,135 L40,142 L45,135" fill="none" stroke="#002448" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="52.0" y="133.0" font-size="11.5" font-weight="600" fill="#4b5d72" text-anchor="start">no hits</text>
  <rect x="8" y="142" width="384" height="150" rx="8" fill="#e6f4ea" stroke="#30b454" stroke-width="1.5"/>
  <text x="20.0" y="164.0" font-size="12.5" font-weight="700" fill="#1b7a3a" text-anchor="start">Inside the 6Sense Filter</text>
  <rect x="18" y="174" width="364" height="62" rx="6" fill="#ffffff" stroke="#d6dfe8" stroke-width="1.5"/>
  <circle cx="44" cy="205" r="12" fill="#30b454" stroke="#002448" stroke-width="1.5"/>
  <text x="44.0" y="210.0" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="66.0" y="201.0" font-size="15" font-weight="700" fill="#002448" text-anchor="start">Misuse and dual-use risk</text>
  <text x="66.0" y="219.0" font-size="12.5" font-weight="500" fill="#4b5d72" text-anchor="start">Seven criteria, each scored 1 to 5</text>
  <rect x="278" y="198" width="10" height="14" rx="2" fill="#30b454"/>
  <rect x="292" y="198" width="10" height="14" rx="2" fill="#30b454"/>
  <rect x="306" y="198" width="10" height="14" rx="2" fill="#30b454"/>
  <rect x="320" y="198" width="10" height="14" rx="2" fill="#30b454"/>
  <rect x="334" y="198" width="10" height="14" rx="2" fill="#30b454"/>
  <rect x="348" y="198" width="10" height="14" rx="2" fill="#30b454"/>
  <rect x="362" y="198" width="10" height="14" rx="2" fill="#30b454"/>
  <text x="20.0" y="262.0" font-size="12.5" font-weight="500" fill="#4b5d72" text-anchor="start">1 is high risk, 5 is low risk.</text>
  <text x="20.0" y="279.0" font-size="12.5" font-weight="500" fill="#4b5d72" text-anchor="start">The score counts alongside the six dimensions.</text>
</svg>
