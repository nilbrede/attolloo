  <rect x="319.7" y="82" width="52.3" height="18" rx="3" fill="#9ad9ac"/>
  <text x="28.0" y="212.0" font-size="13" font-weight="600" fill="#002448" text-anchor="start">Compliance: gated milestones</text>
