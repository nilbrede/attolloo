  <text x="28.0" y="72.0" font-size="13" font-weight="600" fill="#002448" text-anchor="start">Product: short iterations</text>
  <rect x="28.0" y="82" width="52.3" height="18" rx="3" fill="#9ad9ac"/>
  <rect x="86.3" y="82" width="52.3" height="18" rx="3" fill="#9ad9ac"/>
