  <rect x="261.3" y="174" width="110.7" height="18" rx="3" fill="#b9c8da"/>
  <line x1="138.7" y1="102" x2="138.7" y2="170" stroke="#002448" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M138.7,172 l7,11 l-7,11 l-7,-11 z" fill="#e9b44c" stroke="#002448" stroke-width="1.2"/>
