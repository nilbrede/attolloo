<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t d" font-family="Schibsted Grotesk, Segoe UI, Arial, sans-serif">
  <title id="t">How a Polaris sprint keeps product and compliance in step</title>
  <desc id="d">Over ninety days, short product iterations run alongside three gated compliance milestones. Handover checkpoints connect the two tracks. Each sprint ends in evidence for the next capital decision.</desc>
