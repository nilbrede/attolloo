<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t d" font-family="Schibsted Grotesk, Segoe UI, Arial, sans-serif">
  <title id="t">Drum-Buffer-Rope in a venture studio</title>
  <desc id="d">Incoming ventures pass the buffer, the 6Sense Filter, before reaching the drum, the executive's attention, and becoming active engagements. A rope runs from the drum back to the entry point: Polaris Sprints pace the intake, so new work enters only as fast as the drum can carry it.</desc>
  <text x="10.0" y="86.0" font-size="12" font-weight="600" fill="#4b5d72" text-anchor="start">Incoming</text>
  <text x="10.0" y="102.0" font-size="12" font-weight="600" fill="#4b5d72" text-anchor="start">ventures</text>
  <line x1="66" y1="92" x2="81" y2="92" stroke="#002448" stroke-width="1.5"/>
  <path d="M79,87 L86,92 L79,97" fill="none" stroke="#002448" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="86" y="58" width="96" height="68" rx="6" fill="#ffffff" stroke="#002448" stroke-width="1.5"/>
  <text x="134.0" y="88.0" font-size="14.5" font-weight="700" fill="#002448" text-anchor="middle">Buffer</text>
  <text x="134.0" y="106.0" font-size="12" font-weight="500" fill="#4b5d72" text-anchor="middle">6Sense Filter</text>
  <line x1="182" y1="92" x2="203" y2="92" stroke="#002448" stroke-width="1.5"/>
  <path d="M201,87 L208,92 L201,97" fill="none" stroke="#002448" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="250" cy="92" r="42" fill="#dff1e4" stroke="#002448" stroke-width="1.5"/>
  <text x="250.0" y="84.0" font-size="14.5" font-weight="700" fill="#002448" text-anchor="middle">Drum</text>
  <text x="250.0" y="100.0" font-size="11.5" font-weight="500" fill="#4b5d72" text-anchor="middle">Executive</text>
  <text x="250.0" y="114.0" font-size="11.5" font-weight="500" fill="#4b5d72" text-anchor="middle">attention</text>
  <line x1="292" y1="92" x2="309" y2="92" stroke="#002448" stroke-width="1.5"/>
  <path d="M307,87 L314,92 L307,97" fill="none" stroke="#002448" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="316.0" y="86.0" font-size="11.5" font-weight="600" fill="#4b5d72" text-anchor="start">Active</text>
  <text x="316.0" y="102.0" font-size="11.5" font-weight="600" fill="#4b5d72" text-anchor="start">engagements</text>
  <path d="M250,134 V196 H38 V122" fill="none" stroke="#1b7a3a" stroke-width="2" stroke-dasharray="6 5" stroke-linejoin="round"/>
  <path d="M32,129 L38,120 L44,129" fill="none" stroke="#1b7a3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="144.0" y="222.0" font-size="14.5" font-weight="700" fill="#002448" text-anchor="middle">Rope</text>
  <text x="144.0" y="240.0" font-size="12" font-weight="500" fill="#4b5d72" text-anchor="middle">Polaris Sprints pace the intake</text>
  <line x1="10" y1="262" x2="390" y2="262" stroke="#d6dfe8" stroke-width="1.5"/>
  <text x="200.0" y="284.0" font-size="12.5" font-weight="600" fill="#002448" text-anchor="middle">New work enters only as fast as the drum can carry it.</text>
</svg>
