backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

publish_mode: editorial_workflow
locale: "no"

collections:
  # Felles nettsidedata (site.json)
  - label: "Felles"
    name: "site"
    files:
      - label: "Nettside – Felles"
        name: "site"
        file: "data/site.json"
        fields:
          - { name: orgnr, label: "Organisasjonsnummer", widget: "string" }
          - { name: footer, label: "Footer-tekst", widget: "markdown", default: "Attolloogroup. Alle rettigheter forbeholdt." }

  # Forside (home.json)
  - label: "Forside"
    name: "home"
    files:
      - label: "Home"
        name: "home"
        file: "data/home.json"
        fields:
          - { name: title, label: "Tittel (hero)", widget: "string" }
          - { name: subtitle, label: "Ingress (hero)", widget: "markdown", required: false }
          - { name: hero_image, label: "Hero-bilde", widget: "image", choose_url: true, allow_multiple: false, required: false }
          - name: sections
            label: "Forside-seksjoner"
            widget: "list"
            collapsed: true
            fields:
              - { name: heading, label: "Overskrift", widget: "string" }
              - { name: body, label: "Tekst", widget: "markdown", hint: "To nivåer: en linje som starter med +++ og en tittel legger teksten under bak den tittelen (leseren klikker for å åpne). En linje med bare +++ avslutter. Ramme: en linje som starter med ::: og en tittel legger teksten under i en ramme. En linje med bare ::: avslutter." }
              - { name: image, label: "Bilde", widget: "image", choose_url: true, required: false }

  # Om oss (about.json)
  - label: "Om oss"
    name: "about"
    files:
      - label: "About"
        name: "about"
        file: "data/about.json"
        fields:
          - { name: title, label: "Tittel (hero)", widget: "string" }
          - { name: subtitle, label: "Ingress (hero)", widget: "markdown", required: false }
          - { name: hero_image, label: "Hero-bilde", widget: "image", choose_url: true, allow_multiple: false, required: false }
          - name: sections
            label: "Seksjoner"
            widget: "list"
            collapsed: true
            fields:
              - { name: heading, label: "Overskrift", widget: "string" }
              - { name: body, label: "Brødtekst", widget: "markdown", hint: "To nivåer: en linje som starter med +++ og en tittel legger teksten under bak den tittelen (leseren klikker for å åpne). En linje med bare +++ avslutter. Ramme: en linje som starter med ::: og en tittel legger teksten under i en ramme. En linje med bare ::: avslutter." }
              - { name: image, label: "Bilde", widget: "image", choose_url: true, required: false }

  # How It Works (services.json)
  - label: "How It Works"
    name: "services"
    files:
      - label: "How It Works"
        name: "services"
        file: "data/services.json"
        fields:
          - { name: title, label: "Tittel (hero)", widget: "string" }
          - { name: subtitle, label: "Ingress (hero)", widget: "markdown", required: false }
          - { name: hero_image, label: "Hero-bilde", widget: "image", choose_url: true, allow_multiple: false, required: false }
          - name: sections
            label: "Seksjoner"
            widget: "list"
            collapsed: true
            fields:
              - { name: heading, label: "Overskrift", widget: "string" }
              - { name: body, label: "Brødtekst", widget: "markdown", hint: "To nivåer: en linje som starter med +++ og en tittel legger teksten under bak den tittelen (leseren klikker for å åpne). En linje med bare +++ avslutter. Ramme: en linje som starter med ::: og en tittel legger teksten under i en ramme. En linje med bare ::: avslutter." }
              - { name: image, label: "Bilde", widget: "image", choose_url: true, required: false }

  # 6Sense Filter (6sense.json)
  - label: "6Sense Filter"
    name: "sixsense"
    files:
      - label: "6Sense Filter-side"
        name: "sixsense"
        file: "data/6sense.json"
        fields:
          - { name: title, label: "Tittel (hero)", widget: "string" }
          - { name: subtitle, label: "Ingress (hero)", widget: "markdown", required: false }
          - { name: hero_image, label: "Hero-bilde", widget: "image", choose_url: true, allow_multiple: false, required: false }
          - name: sections
            label: "Seksjoner"
            widget: "list"
            collapsed: true
            fields:
              - { name: heading, label: "Overskrift", widget: "string" }
              - { name: body, label: "Tekst", widget: "markdown", hint: "To nivåer: en linje som starter med +++ og en tittel legger teksten under bak den tittelen (leseren klikker for å åpne). En linje med bare +++ avslutter. Ramme: en linje som starter med ::: og en tittel legger teksten under i en ramme. En linje med bare ::: avslutter." }
              - { name: image, label: "Bilde", widget: "image", choose_url: true, required: false }

  # Polaris (polaris.json)
  - label: "Polaris"
    name: "polaris"
    files:
      - label: "Polaris-side"
        name: "polaris"
        file: "data/polaris.json"
        fields:
          - { name: title, label: "Tittel (hero)", widget: "string" }
          - { name: subtitle, label: "Ingress (hero)", widget: "markdown", required: false }
          - { name: hero_image, label: "Hero-bilde", widget: "image", choose_url: true, allow_multiple: false, required: false }
          - name: sections
            label: "Seksjoner"
            widget: "list"
            collapsed: true
            fields:
              - { name: heading, label: "Overskrift", widget: "string" }
              - { name: body, label: "Tekst", widget: "markdown", hint: "To nivåer: en linje som starter med +++ og en tittel legger teksten under bak den tittelen (leseren klikker for å åpne). En linje med bare +++ avslutter. Ramme: en linje som starter med ::: og en tittel legger teksten under i en ramme. En linje med bare ::: avslutter." }
              - { name: image, label: "Bilde", widget: "image", choose_url: true, required: false }

  # Kando Framework (kando.json)
  - label: "Kando Framework"
    name: "kando"
    files:
      - label: "Kando Framework-side"
        name: "kando"
        file: "data/kando.json"
        fields:
          - { name: title, label: "Tittel (hero)", widget: "string" }
          - { name: subtitle, label: "Ingress (hero)", widget: "markdown", required: false }
          - { name: hero_image, label: "Hero-bilde", widget: "image", choose_url: true, allow_multiple: false, required: false }
          - name: sections
            label: "Seksjoner"
            widget: "list"
            collapsed: true
            fields:
              - { name: heading, label: "Overskrift", widget: "string" }
              - { name: body, label: "Tekst", widget: "markdown", hint: "To nivåer: en linje som starter med +++ og en tittel legger teksten under bak den tittelen (leseren klikker for å åpne). En linje med bare +++ avslutter. Ramme: en linje som starter med ::: og en tittel legger teksten under i en ramme. En linje med bare ::: avslutter." }
              - { name: image, label: "Bilde", widget: "image", choose_url: true, required: false }

  # AI Compass (ai-compass.json)
  - label: "AI Compass"
    name: "ai_compass"
    files:
      - label: "AI Compass-side"
        name: "ai_compass"
        file: "data/ai-compass.json"
        fields:
          - { name: title, label: "Tittel (hero)", widget: "string" }
          - { name: subtitle, label: "Ingress (hero)", widget: "markdown", required: false }
          - { name: hero_image, label: "Hero-bilde", widget: "image", choose_url: true, allow_multiple: false, required: false }
          - name: sections
            label: "Seksjoner"
            widget: "list"
            collapsed: true
            fields:
              - { name: heading, label: "Overskrift", widget: "string" }
              - { name: body, label: "Tekst", widget: "markdown", hint: "To nivåer: en linje som starter med +++ og en tittel legger teksten under bak den tittelen (leseren klikker for å åpne). En linje med bare +++ avslutter. Ramme: en linje som starter med ::: og en tittel legger teksten under i en ramme. En linje med bare ::: avslutter." }
              - { name: image, label: "Bilde", widget: "image", choose_url: true, required: false }

  # Responsible AI (responsible-ai.json)
  - label: "Responsible AI"
    name: "responsible_ai"
    files:
      - label: "Responsible AI"
        name: "responsible_ai"
        file: "data/responsible-ai.json"
        fields:
          - { name: title, label: "Tittel (hero)", widget: "string" }
          - { name: subtitle, label: "Ingress (hero)", widget: "markdown", required: false }
          - { name: hero_image, label: "Hero-bilde", widget: "image", choose_url: true, allow_multiple: false, required: false }
          - name: sections
            label: "Seksjoner"
            widget: "list"
            collapsed: true
            fields:
              - { name: heading, label: "Overskrift", widget: "string" }
              - { name: body, label: "Tekst", widget: "markdown", hint: "To nivåer: en linje som starter med +++ og en tittel legger teksten under bak den tittelen (leseren klikker for å åpne). En linje med bare +++ avslutter. Ramme: en linje som starter med ::: og en tittel legger teksten under i en ramme. En linje med bare ::: avslutter." }
              - { name: image, label: "Bilde", widget: "image", choose_url: true, required: false }

  # Research (research.json)
  - label: "Research"
    name: "research"
    files:
      - label: "Research"
        name: "research"
        file: "data/research.json"
        fields:
          - { name: title, label: "Tittel (hero)", widget: "string" }
          - { name: subtitle, label: "Ingress (hero)", widget: "markdown", required: false }
          - { name: hero_image, label: "Hero-bilde", widget: "image", choose_url: true, allow_multiple: false, required: false }
          - name: sections
            label: "Seksjoner"
            widget: "list"
            collapsed: true
            fields:
              - { name: heading, label: "Overskrift", widget: "string" }
              - { name: body, label: "Tekst", widget: "markdown", hint: "To nivåer: en linje som starter med +++ og en tittel legger teksten under bak den tittelen (leseren klikker for å åpne). En linje med bare +++ avslutter. Ramme: en linje som starter med ::: og en tittel legger teksten under i en ramme. En linje med bare ::: avslutter." }
              - { name: image, label: "Bilde", widget: "image", choose_url: true, required: false }

  # Metoden i praksis, eksempel (example.json)
  - label: "Metoden i praksis"
    name: "example"
    files:
      - label: "Metoden i praksis"
        name: "example"
        file: "data/example.json"
        fields:
          - { name: title, label: "Tittel (hero)", widget: "string" }
          - { name: subtitle, label: "Ingress (hero)", widget: "markdown", required: false }
          - { name: hero_image, label: "Hero-bilde", widget: "image", choose_url: true, allow_multiple: false, required: false }
          - name: sections
            label: "Seksjoner"
            widget: "list"
            collapsed: true
            fields:
              - { name: heading, label: "Overskrift", widget: "string" }
              - { name: body, label: "Tekst", widget: "markdown", hint: "To nivåer: en linje som starter med +++ og en tittel legger teksten under bak den tittelen (leseren klikker for å åpne). En linje med bare +++ avslutter. Ramme: en linje som starter med ::: og en tittel legger teksten under i en ramme. En linje med bare ::: avslutter." }
              - { name: image, label: "Bilde", widget: "image", choose_url: true, required: false }

  # Kontaktsiden (contact.json)
  - label: "Kontakt"
    name: "contact"
    files:
      - label: "Kontaktsiden"
        name: "contact"
        file: "data/contact.json"
        fields:
          - { name: title, label: "Tittel (hero)", widget: "string" }
          - { name: subtitle, label: "Ingress (hero)", widget: "text", required: false }
          - { name: hero_image, label: "Hero-bilde", widget: "image", choose_url: true, required: false }
          - { name: name, label: "Navn", widget: "string" }
          - { name: role, label: "Rolle", widget: "string" }
          - { name: photo, label: "Bilde", widget: "image", choose_url: true, required: false }
          - { name: email, label: "E-post", widget: "string" }
          - { name: linkedin, label: "LinkedIn-adresse", widget: "string", required: false, hint: "Hele adressen, for eksempel https://www.linkedin.com/in/navn/. La feltet stå tomt for å skjule linjen." }
          - { name: location, label: "Sted", widget: "string" }
          - { name: form_heading, label: "Overskrift over skjemaet", widget: "string" }
          - { name: form_intro, label: "Tekst over skjemaet", widget: "text", required: false }
          - { name: privacy_note, label: "Personvernlinje under skjemaet", widget: "text" }
          - { name: success_heading, label: "Overskrift når meldingen er sendt", widget: "string" }
          - { name: success_body, label: "Tekst når meldingen er sendt", widget: "text" }

  # Personvernsiden (privacy.json)
  - label: "Personvern"
    name: "privacy"
    files:
      - label: "Privacy"
        name: "privacy"
        file: "data/privacy.json"
        fields:
          - { name: title, label: "Tittel (hero)", widget: "string" }
          - { name: subtitle, label: "Ingress (hero)", widget: "text", required: false }
          - { name: hero_image, label: "Hero-bilde", widget: "image", choose_url: true, allow_multiple: false, required: false }
          - name: sections
            label: "Seksjoner"
            widget: "list"
            collapsed: true
            fields:
              - { name: heading, label: "Overskrift", widget: "string" }
              - { name: body, label: "Tekst", widget: "markdown", hint: "Husk å oppdatere datoen nederst når noe endres. Siden skal beskrive det nettstedet faktisk gjør." }
              - { name: image, label: "Bilde", widget: "image", choose_url: true, required: false }

  # Figurene på forsiden (timeline.json og gates.json)
  - label: "Figurer på forsiden"
    name: "figures"
    files:
      - label: "Tidslinje: hva gjelder, og når"
        name: "timeline"
        file: "data/timeline.json"
        fields:
          - { name: section, label: "Vises i stedet for bildet i seksjon nr.", widget: "number", value_type: "int", min: 1, max: 12, hint: "Seksjonene på forsiden telles ovenfra. 1 er den første." }
          - { name: title, label: "Overskrift", widget: "string" }
          - { name: today_label, label: "Ordet for «i dag»", widget: "string" }
          - { name: applies_label, label: "Ordet for «gjelder nå»", widget: "string" }
          - { name: note, label: "Linje under tidslinjen", widget: "text", required: false }
          - name: events
            label: "Datoer"
            label_singular: "dato"
            widget: "list"
            collapsed: true
            summary: "{{fields.date}} – {{fields.name}}"
            hint: "Rekkefølgen ordnes etter dato. «I dag» og tiden som gjenstår regnes ut av seg selv."
            fields:
              - { name: date, label: "Gjelder fra", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
              - { name: name, label: "Regelverk", widget: "string" }
              - { name: what, label: "Hva som begynner å gjelde", widget: "text", required: false }
      - label: "Who has to say yes?"
        name: "gates"
        file: "data/gates.json"
        fields:
          - { name: title, label: "Overskrift", widget: "string" }
          - { name: intro, label: "Ingress", widget: "text", required: false }
          - { name: switch_label, label: "Navn på valget (for skjermlesere)", widget: "string" }
          - { name: from_label, label: "Tekst ved starten av linjen", widget: "string" }
          - { name: to_label, label: "Tekst ved enden av linjen", widget: "string" }
          - { name: asks_label, label: "Overskrift over spørsmålene", widget: "string" }
          - { name: assessment_label, label: "Innledning til linjen om vurderingen", widget: "string" }
          - { name: next_label, label: "Tekst på knappen til neste port", widget: "string" }
          - { name: link_label, label: "Tekst på knappen etter siste port", widget: "string" }
          - { name: link_url, label: "Lenke for den knappen", widget: "string" }
          - { name: note, label: "Linje nederst", widget: "text", required: false }
          - name: paths
            label: "Veier inn i markedet"
            label_singular: "vei"
            widget: "list"
            collapsed: true
            summary: "{{fields.label}}"
            fields:
              - { name: label, label: "Valget leseren tar", widget: "string" }
              - name: gates
                label: "Porter"
                label_singular: "port"
                widget: "list"
                collapsed: true
                summary: "{{fields.name}}"
                fields:
                  - { name: name, label: "Hvem som må si ja (kort)", widget: "string" }
                  - { name: who, label: "Hvem det er", widget: "text", required: false }
                  - { name: questions, label: "Hva de spør om", widget: "list", field: { name: question, label: "Spørsmål", widget: "string" } }
                  - { name: assessment, label: "Hva vurderingen dekker (fortsetter setningen)", widget: "text", required: false }

  # Ett-minutts pitch, animasjon (pitch.json)
  - label: "Pitch-animasjon"
    name: "pitch"
    files:
      - label: "Pitch på ett minutt"
        name: "pitch"
        file: "data/pitch.json"
        fields:
          - { name: poster_title, label: "Tittel før avspilling", widget: "string" }
          - { name: play_label, label: "Tekst på startknappen", widget: "string" }
          - { name: poster_note, label: "Liten tekst ved startknappen", widget: "string", required: false }
          - { name: replay_label, label: "Tekst for å spille på nytt", widget: "string" }
          - { name: transcript_label, label: "Tekst for «les som tekst»", widget: "string" }
          - { name: cta_label, label: "Knapp i siste scene", widget: "string" }
          - { name: cta_url, label: "Lenke for knappen", widget: "string" }
          - name: line
            label: "Linjen nederst"
            widget: "object"
            collapsed: true
            fields:
              - { name: left, label: "Venstre", widget: "string" }
              - { name: right, label: "Høyre", widget: "string" }
              - { name: gap, label: "Gapet", widget: "string" }
              - { name: bridge, label: "Når gapet er lukket", widget: "string" }
          - name: scenes
            label: "Scener"
            label_singular: "scene"
            widget: "list"
            collapsed: true
            summary: "{{fields.seconds}} s – {{fields.headline}}"
            fields:
              - name: type
                label: "Type"
                widget: "select"
                options:
                  - { label: "Utsagn (stor tekst)", value: "statement" }
                  - { label: "Liste (overskrift + punkter)", value: "list" }
                  - { label: "Avslutning (med knapp)", value: "close" }
              - { name: seconds, label: "Varighet i sekunder", widget: "number", value_type: "int", min: 3, max: 20 }
              - { name: headline, label: "Overskrift", widget: "text" }
              - { name: items, label: "Punkter («Navn: forklaring» gir navnet i fet skrift)", widget: "list", field: { name: item, label: "Punkt", widget: "string" }, required: false }
              - { name: detail, label: "Tilleggslinje", widget: "text", required: false }
              - { name: image, label: "Bakgrunnsbilde", widget: "image", choose_url: true, required: false, hint: "Bildet tones ned bak teksten. Scener etter hverandre med samme bilde får én sammenhengende, langsom zoom." }
              - name: focus
                label: "Utsnitt av bildet"
                widget: "select"
                required: false
                default: "center"
                options:
                  - { label: "Midten", value: "center" }
                  - { label: "Øvre del", value: "top" }
                  - { label: "Nedre del", value: "bottom" }
              - name: figure
                label: "Utforming av punktene"
                widget: "select"
                required: false
                default: ""
                options:
                  - { label: "Vanlig (tekst og punktliste)", value: "" }
                  - { label: "Rutenett med streker (2 kolonner)", value: "grid" }
                  - { label: "Kolonner med grønn strek", value: "columns" }
                  - { label: "Merkelapper i ramme", value: "tags" }
                  - { label: "De fire rammeverkene med tegninger", value: "frameworks" }
                  - { label: "Rød linje under overskriften", value: "redline" }
              - name: line
                label: "Linjen nederst i denne scenen"
                widget: "select"
                options:
                  - { label: "Uten gap-merking", value: "base" }
                  - { label: "Gapet vises", value: "gap" }
                  - { label: "Gapet er lukket (Attolloo)", value: "bridge" }

  # Selvtest "Are we a match?" (match.json)
  - label: "Selvtest"
    name: "match"
    files:
      - label: "Selvtest – Are we a match?"
        name: "match"
        file: "data/match.json"
        fields:
          - { name: title, label: "Tittel", widget: "string" }
          - { name: subtitle, label: "Ingress", widget: "text" }
          - { name: intro_heading, label: "Overskrift på startskjermen", widget: "string" }
          - { name: intro_body, label: "Tekst på startskjermen", widget: "text" }
          - { name: start_label, label: "Tekst på startknappen", widget: "string" }
          - { name: privacy_note, label: "Personvernnotis", widget: "text" }
          - { name: contact_email, label: "E-post som svarene sendes til", widget: "string" }
          - name: questions
            label: "Spørsmål"
            label_singular: "spørsmål"
            widget: "list"
            collapsed: true
            summary: "{{fields.dimension}} – {{fields.question}}"
            fields:
              - name: group
                label: "Type"
                widget: "select"
                options:
                  - { label: "Passform (kan utelukke match)", value: "fit" }
                  - { label: "6Sense-dimensjon", value: "dimension" }
              - { name: dimension, label: "Navn (dimensjon eller tema)", widget: "string" }
              - { name: question, label: "Spørsmål", widget: "text" }
              - { name: help, label: "Hjelpetekst", widget: "text", required: false }
              - name: options
                label: "Svaralternativer"
                label_singular: "svaralternativ"
                widget: "list"
                collapsed: true
                summary: "{{fields.score}} – {{fields.label}}"
                fields:
                  - { name: label, label: "Svartekst", widget: "text" }
                  - name: score
                    label: "Verdi"
                    widget: "select"
                    value_type: "int"
                    options:
                      - { label: "2 – Dokumentert / passer", value: 2 }
                      - { label: "1 – Delvis / må diskuteres", value: 1 }
                      - { label: "0 – Ikke ennå / utelukker (for passform)", value: 0 }
                  - { name: note, label: "Forklaring i resultatet (valgfritt)", widget: "text", required: false }
          - name: results
            label: "Resultattekster"
            widget: "object"
            collapsed: true
            fields:
              - name: strong
                label: "Match"
                widget: "object"
                fields:
                  - { name: heading, label: "Overskrift", widget: "string" }
                  - { name: body, label: "Tekst", widget: "text" }
              - name: possible
                label: "Mulig match"
                widget: "object"
                fields:
                  - { name: heading, label: "Overskrift", widget: "string" }
                  - { name: body, label: "Tekst", widget: "text" }
              - name: not_yet
                label: "Ikke ennå"
                widget: "object"
                fields:
                  - { name: heading, label: "Overskrift", widget: "string" }
                  - { name: body, label: "Tekst", widget: "text" }
              - name: veto
                label: "Veto (Decision)"
                widget: "object"
                fields:
