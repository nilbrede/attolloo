backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

publish_mode: editorial_workflow
locale: "no"

collections:
  # Felles nettsidedata (site.json)
  - label: "Felles"
    name: "site"
    files:
      - label: "Nettside – Felles"
        name: "site"
        file: "data/site.json"
        fields:
          - { name: orgnr, label: "Organisasjonsnummer", widget: "string" }
          - { name: footer, label: "Footer-tekst", widget: "markdown", default: "Attolloogroup. Alle rettigheter forbeholdt." }

  # Forside (home.json)
  - label: "Forside"
    name: "home"
    files:
      - label: "Home"
        name: "home"
        file: "data/home.json"
        fields:
          - { name: title, label: "Tittel (hero)", widget: "string" }
          - { name: subtitle, label: "Ingress (hero)", widget: "markdown", required: false }
          - { name: hero_image, label: "Hero-bilde", widget: "image", choose_url: true, allow_multiple: false, required: false }
          - name: sections
            label: "Forside-seksjoner"
            widget: "list"
            collapsed: true
            fields:
              - { name: heading, label: "Overskrift", widget: "string" }
              - { name: body, label: "Tekst", widget: "markdown" }
              - { name: image, label: "Bilde", widget: "image", choose_url: true, required: false }

  # Om oss (about.json)
  - label: "Om oss"
    name: "about"
    files:
      - label: "About"
        name: "about"
        file: "data/about.json"
        fields:
          - { name: title, label: "Tittel (hero)", widget: "string" }
          - { name: subtitle, label: "Ingress (hero)", widget: "markdown", required: false }
          - { name: hero_image, label: "Hero-bilde", widget: "image", choose_url: true, allow_multiple: false, required: false }
          - name: sections
            label: "Seksjoner"
            widget: "list"
            collapsed: true
            fields:
              - { name: heading, label: "Overskrift", widget: "string" }
              - { name: body, label: "Brødtekst", widget: "markdown" }
              - { name: image, label: "Bilde", widget: "image", choose_url: true, required: false }

  # Tjenester (services.json)
  - label: "Tjenester"
    name: "services"
    files:
      - label: "Services"
        name: "services"
        file: "data/services.json"
        fields:
          - { name: title, label: "Tittel (hero)", widget: "string" }
          - { name: subtitle, label: "Ingress (hero)", widget: "markdown", required: false }
          - { name: hero_image, label: "Hero-bilde", widget: "image", choose_url: true, allow_multiple: false, required: false }
          - name: sections
            label: "Seksjoner"
            widget: "list"
            collapsed: true
            fields:
              - { name: heading, label: "Overskrift", widget: "string" }
              - { name: body, label: "Brødtekst", widget: "markdown" }
              - { name: image, label: "Bilde", widget: "image", choose_url: true, required: false }

  # Startups & Scaleups (startups.json)
  - label: "Attolloo 6Sense"
    name: "startups"
    files:
      - label: "Attolloo 6Sense"
        name: "startups"
        file: "data/startups.json"
        fields:
          - { name: title, label: "Tittel (hero)", widget: "string" }
          - { name: subtitle, label: "Ingress (hero)", widget: "markdown", required: false }
          - { name: hero_image, label: "Hero-bilde", widget: "image", choose_url: true, allow_multiple: false, required: false }
          - name: sections
            label: "Seksjoner"
            widget: "list"
            collapsed: true
            fields:
              - { name: heading, label: "Overskrift", widget: "string" }
              - { name: body, label: "Tekst", widget: "markdown" }
              - { name: image, label: "Bilde", widget: "image", choose_url: true, required: false }

  # Polaris (polaris.json)
  - label: "Polaris"
    name: "polaris"
    files:
      - label: "Polaris-side"
        name: "polaris"
        file: "data/polaris.json"
        fields:
          - { name: title, label: "Tittel (hero)", widget: "string" }
          - { name: subtitle, label: "Ingress (hero)", widget: "markdown", required: false }
          - { name: hero_image, label: "Hero-bilde", widget: "image", choose_url: true, allow_multiple: false, required: false }
          - name: sections
            label: "Seksjoner"
            widget: "list"
            collapsed: true
            fields:
              - { name: heading, label: "Overskrift", widget: "string" }
              - { name: body, label: "Tekst", widget: "markdown" }
              - { name: image, label: "Bilde", widget: "image", choose_url: true, required: false }

  # Kando Framework (lumina.json)
  - label: "Kando Framework"
    name: "lumina"
    files:
      - label: "Kando Framework-side"
        name: "lumina"
        file: "data/lumina.json"
        fields:
          - { name: title, label: "Tittel (hero)", widget: "string" }
          - { name: subtitle, label: "Ingress (hero)", widget: "markdown", required: false }
          - { name: hero_image, label: "Hero-bilde", widget: "image", choose_url: true, allow_multiple: false, required: false }
          - name: sections
            label: "Seksjoner"
            widget: "list"
            collapsed: true
            fields:
              - { name: heading, label: "Overskrift", widget: "string" }
              - { name: body, label: "Tekst", widget: "markdown" }
              - { name: image, label: "Bilde", widget: "image", choose_url: true, required: false }

  # AI Compass (ai-compass.json)
  - label: "AI Compass"
    name: "ai_compass"
    files:
      - label: "AI Compass-side"
        name: "ai_compass"
        file: "data/ai-compass.json"
        fields:
          - { name: title, label: "Tittel (hero)", widget: "string" }
          - { name: subtitle, label: "Ingress (hero)", widget: "markdown", required: false }
          - { name: hero_image, label: "Hero-bilde", widget: "image", choose_url: true, allow_multiple: false, required: false }
          - name: sections
            label: "Seksjoner"
            widget: "list"
            collapsed: true
            fields:
              - { name: heading, label: "Overskrift", widget: "string" }
              - { name: body, label: "Tekst", widget: "markdown" }
              - { name: image, label: "Bilde", widget: "image", choose_url: true, required: false }

  # Selvtest "Are we a match?" (match.json)
  - label: "Selvtest"
    name: "match"
    files:
      - label: "Selvtest – Are we a match?"
        name: "match"
        file: "data/match.json"
        fields:
          - { name: title, label: "Tittel", widget: "string" }
          - { name: subtitle, label: "Ingress", widget: "text" }
          - { name: intro_heading, label: "Overskrift på startskjermen", widget: "string" }
          - { name: intro_body, label: "Tekst på startskjermen", widget: "text" }
          - { name: start_label, label: "Tekst på startknappen", widget: "string" }
          - { name: privacy_note, label: "Personvernnotis", widget: "text" }
          - { name: contact_email, label: "E-post som svarene sendes til", widget: "string" }
          - name: questions
            label: "Spørsmål"
            label_singular: "spørsmål"
            widget: "list"
            collapsed: true
            summary: "{{fields.dimension}} – {{fields.question}}"
            fields:
              - name: group
                label: "Type"
                widget: "select"
                options:
                  - { label: "Passform (kan utelukke match)", value: "fit" }
                  - { label: "6Sense-dimensjon", value: "dimension" }
              - { name: dimension, label: "Navn (dimensjon eller tema)", widget: "string" }
              - { name: question, label: "Spørsmål", widget: "text" }
              - { name: help, label: "Hjelpetekst", widget: "text", required: false }
              - name: options
                label: "Svaralternativer"
                label_singular: "svaralternativ"
                widget: "list"
                collapsed: true
                summary: "{{fields.score}} – {{fields.label}}"
                fields:
                  - { name: label, label: "Svartekst", widget: "text" }
                  - name: score
                    label: "Verdi"
                    widget: "select"
                    value_type: "int"
                    options:
                      - { label: "2 – Dokumentert / passer", value: 2 }
                      - { label: "1 – Delvis / må diskuteres", value: 1 }
                      - { label: "0 – Ikke ennå / utelukker (for passform)", value: 0 }
                  - { name: note, label: "Forklaring i resultatet (valgfritt)", widget: "text", required: false }
          - name: results
            label: "Resultattekster"
            widget: "object"
            collapsed: true
            fields:
              - name: strong
                label: "Match"
                widget: "object"
                fields:
                  - { name: heading, label: "Overskrift", widget: "string" }
                  - { name: body, label: "Tekst", widget: "text" }
              - name: possible
                label: "Mulig match"
                widget: "object"
                fields:
                  - { name: heading, label: "Overskrift", widget: "string" }
                  - { name: body, label: "Tekst", widget: "text" }
              - name: not_yet
                label: "Ikke ennå"
                widget: "object"
                fields:
                  - { name: heading, label: "Overskrift", widget: "string" }
                  - { name: body, label: "Tekst", widget: "text" }
              - name: veto
                label: "Veto (Decision)"
                widget: "object"
                fields:
                  - { name: heading, label: "Overskrift", widget: "string" }
                  - { name: body, label: "Tekst", widget: "text" }
              - name: excluded
                label: "Utenfor målgruppen"
                widget: "object"
                fields:
                  - { name: heading, label: "Overskrift", widget: "string" }
                  - { name: body, label: "Tekst", widget: "text" }
          - { name: scoring_note, label: "Forklaring av poengberegningen", widget: "text" }

  # Blogginnlegg (posts)
  - label: "Blogginnlegg"
    name: "posts"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    path: "{{slug}}/index"
    extension: "md"
    format: "frontmatter"
    preview_path: "blogg/{{slug}}"
    fields:
      - { label: "Tittel", name: "title", widget: "string" }
      - { label: "Publisert", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false }
      - { label: "Ingress", name: "excerpt", widget: "text" }
      - { label: "Innhold", name: "body", widget: "markdown" }
      - { label: "Bilde", name: "image", widget: "image", choose_url: true, required: false }