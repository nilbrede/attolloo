<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About – Attolloo Group</title>
  <meta name="description" content="Attolloo Group is founded and led by Nils Johan Brede: four decades of executive experience in regulated markets, built into one validated methodology stack." />
  <link rel="canonical" href="https://attolloogroup.com/about.html" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Attolloo Group" />
  <meta property="og:title" content="About – Attolloo Group" />
  <meta property="og:description" content="Attolloo Group is founded and led by Nils Johan Brede: four decades of executive experience in regulated markets, built into one validated methodology stack." />
  <meta property="og:url" content="https://attolloogroup.com/about.html" />
  <meta property="og:image" content="https://attolloogroup.com/images/uploads/sergei-a-helwtuan3c-unsplash.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "AboutPage",
        "@id": "https://attolloogroup.com/about.html#webpage",
        "url": "https://attolloogroup.com/about.html",
        "name": "About – Attolloo Group",
        "description": "Attolloo Group is founded and led by Nils Johan Brede: four decades of executive experience in regulated markets, built into one validated methodology stack.",
        "inLanguage": "en",
        "isPartOf": {
          "@id": "https://attolloogroup.com/#website"
        },
        "about": {
          "@id": "https://attolloogroup.com/#organization"
        }
      },
      {
        "@type": "WebSite",
        "@id": "https://attolloogroup.com/#website",
        "url": "https://attolloogroup.com/",
        "name": "Attolloo Group"
      },
      {
        "@type": "Organization",
        "@id": "https://attolloogroup.com/#organization",
        "name": "Attolloo Group AS",
        "url": "https://attolloogroup.com/"
      }
    ]
  }
  </script>
  <link rel="stylesheet" href="style.css?v=9" />
</head>
<body>

  <div class="page-top-space"></div>

  <!-- HERO -->
  <section class="hero about-hero" id="about-hero" aria-labelledby="heroTitle">
    <div class="inner">
      <h1 class="hero-title" id="heroTitle"></h1>
      <!-- Viktig: behold linjeskift -->
      <p id="heroSubtitle" class="preserve-newlines"></p>
    </div>
  </section>

  <main class="container">
    <section class="section">
      <div class="cards" id="about-cards"></div>
    </section>
  </main>

  <div id="footer"></div>

  <script>
    // last om-oss-data
    (async function loadAbout() {
      try {
        const res = await fetch("data/about.json?v=" + Date.now(), { cache: "no-store" });
        const data = await res.json();

        document.getElementById("heroTitle").textContent = data.title || "";
        document.getElementById("heroSubtitle").textContent = data.subtitle || "";

        const hero = document.getElementById("about-hero");
        const img = data.hero_image || data.image || "";
        if (img) {
          hero.style.backgroundImage = `url(${img})`;
          hero.classList.add("has-image");
        } else {
          hero.classList.remove("has-image");
        }

        const wrap = document.getElementById("about-cards");
        const sections = Array.isArray(data.sections) ? data.sections : [];
        if (!sections.length) {
          wrap.innerHTML = "<p>No content published yet.</p>";
          return;
        }

        wrap.innerHTML = sections.map(s => `
          <article class="card">
            ${s.image ? `<div class="card_media"><img src="${s.image}" alt=""></div>` : ""}
            <div class="card_body">
              ${s.heading ? `<h3 class="card_title">${s.heading}</h3>` : ""}
              ${s.body ? `<div class="card_text preserve-newlines">${s.body}</div>` : ""}
            </div>
          </article>
        `).join("");
      } catch (e) {
        console.error("Klarte ikke laste data/about.json", e);
      }
    })();

    // footer
    (async () => {
      try {
        const res = await fetch("footer.html", { cache: "no-store" });
        const html = await res.text();
        document.getElementById("footer").innerHTML = html;
      } catch (err) {
        console.error("Kunne ikke laste footer:", err);
      }
    })();
  </script>
<script src="/js/menu-init.js" defer></script>
</body>
</html>
